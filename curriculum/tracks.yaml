# CMM 학습 커리큘럼 — Track / Chapter 골격
# 규격: curriculum/README.md §3
#
# 학습 순서 원칙 (강사 파일 순서가 아니라 실제 학습 순서):
#   design-and-planning / tooling-and-collaboration 은 코드 트랙과 병행(먼저 시작).
#   web-foundations → javascript → react → typescript → nextjs 가 주 흐름.
#   data-and-backend / deployment-and-infra 는 nextjs 이후 통합 단계.
#   ai-engineering / coding-test 는 대부분 needs_external_research (자료 없음).

tracks:
  # ────────────────────────────────────────────────────────────────────────
  - id: design-and-planning
    title: 디자인·기획 기초
    summary: 화면을 만들기 전에 하는 일 — UI 디자인 원칙, Figma, 정보구조, 레퍼런스 분석, 시안을 코드로 옮기기.
    kind: curriculum
    ord: 5
    status: active
    chapters:
      - id: design-and-planning/ui-design-foundations
        title: UI 디자인 기초
        summary: 타이포그래피·대비·여백·폼 디자인, 디자인 토큰(variable), 오토레이아웃 사고.
        ord: 10
        status: active
      - id: design-and-planning/figma
        title: Figma
        summary: Figma 기본 조작, 플러그인, MCP 연동.
        ord: 20
        status: active
      - id: design-and-planning/planning-and-ia
        title: 기획과 정보구조
        summary: 정보구조(IA), 레퍼런스 조사·분석, 스토리보드, 홈페이지 개설 절차.
        ord: 30
        status: active
      - id: design-and-planning/design-to-code
        title: 시안을 코드로
        summary: 디자인 참조 코딩, 상세페이지 연결, 정렬/필터/장바구니 같은 화면 패턴을 시안에서 코드로.
        ord: 40
        status: active

  # ────────────────────────────────────────────────────────────────────────
  - id: tooling-and-collaboration
    title: 개발 도구와 협업
    summary: Git/GitHub, 커밋·브랜치, README, 다이어그램, 에디터 세팅 — 코드 트랙과 병행해 일찍 익힌다.
    kind: curriculum
    ord: 15
    status: active
    chapters:
      - id: tooling-and-collaboration/git-basics
        title: Git 기초
        summary: 버전 관리 개념, add/commit/branch/merge, 자주 만나는 에러 대처.
        ord: 10
        status: active
      - id: tooling-and-collaboration/github-workflow
        title: GitHub 워크플로
        summary: GitHub Desktop, 원격 저장소, GitHub Pages 로 페이지 열기, README 작성법.
        ord: 20
        status: active
      - id: tooling-and-collaboration/diagrams-and-docs
        title: 다이어그램과 문서화
        summary: 흐름도·구조도 그리기, 문서로 남기기.
        ord: 30
        status: active
      - id: tooling-and-collaboration/editor-setup
        title: 에디터·패키지 도구
        summary: VS Code 세팅, npm 기본.
        ord: 40
        status: active

  # ────────────────────────────────────────────────────────────────────────
  - id: web-foundations
    title: 웹 프론트엔드 토대 (HTML·CSS)
    summary: 문서 구조와 스타일. 시맨틱 마크업, 박스모델, Flexbox/Grid 레이아웃, CSS3 효과, 전처리기, 반응형, 웹표준·접근성.
