        title: 언어 기본
        summary: 필수 암기, 자료형, 변수와 형 변환, 조건문, 배열과 반복문, 함수.
        ord: 10
        status: active
      - id: javascript/functions-and-scope
        title: 함수와 스코프
        summary: 함수 심화, 스코프와 클로저, 콜백, 지연 실행.
        ord: 20
        status: active
      - id: javascript/objects-and-builtins
        title: 객체와 내장 객체
        summary: 객체 다루기, 배열 메서드, Array/Object/Math/JSON/String 내장 객체.
        ord: 30
        status: active
      - id: javascript/classes-and-modules
        title: 클래스와 모듈
