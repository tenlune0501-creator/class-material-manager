        ord: 60
        status: active
      - id: javascript/browser-apis-and-storage
        title: 브라우저 API와 저장소
        summary: 쿠키, localStorage, 타이머(setTimeout/setInterval).
        ord: 70
        status: active
      - id: javascript/external-apis
        title: 외부 API 사용
        summary: 지도 API, 기상청·공공데이터 날씨 API, Chart.js 로 시각화.
        ord: 80
        status: active
      - id: javascript/ui-implementation-patterns
        title: UI 구현 패턴
        summary: 슬라이드쇼, 필터, 슬라이더, 스켈레톤 UI, 숫자 애니메이션, 페이지네이션, 드래그&드롭 미리보기 등 실전 미니 구현.
        ord: 90
        status: active
      - id: javascript/jquery
