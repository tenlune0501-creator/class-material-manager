    ord: 20
    status: active
    chapters:
      - id: web-foundations/html-structure
        title: HTML 문서 구조
        summary: 시맨틱 태그, 하이퍼링크, 폼 양식, 멀티미디어, 마크업 코딩 컨벤션, 특수문자.
        ord: 10
        status: active
      - id: web-foundations/css-fundamentals
        title: CSS 기초
        summary: 선택자, 박스모델, 포지셔닝, 배경·스프라이트.
        ord: 20
        status: active
      - id: web-foundations/css-layout-flexbox
        title: Flexbox 레이아웃
        summary: 1차원 레이아웃 — 축, 정렬, 분배, 실전 내비게이션.
        ord: 30
        status: active
      - id: web-foundations/css-layout-grid
        title: CSS Grid 레이아웃
        summary: 2차원 레이아웃 — 트랙, fr, 영역 이름, auto-flow, 카드 UI.
        ord: 40
        status: active
      - id: web-foundations/css-text-and-effects
        title: CSS3 텍스트와 효과
        summary: 확장된 텍스트·단락 효과, transition/hover, 애니메이션, 카드 뒤집기 같은 기법.
        ord: 50
        status: active
      - id: web-foundations/css-preprocessors-and-frameworks
        title: 전처리기와 프레임워크
        summary: Sass, LESS, Tailwind CSS.
        ord: 60
        status: active
      - id: web-foundations/responsive-and-modern-css
        title: 반응형과 최신 CSS
        summary: 반응형 레이아웃·비디오, Container Queries, Logical Properties.
        ord: 70
        status: active
      - id: web-foundations/web-standards-and-accessibility
        title: 웹표준과 접근성
        summary: 웹접근성 체크리스트, 문서 로드 순서, 타이포그래피 요약.
        ord: 80
        status: active

  # ────────────────────────────────────────────────────────────────────────
  - id: javascript
